# Adds Docker-native healthchecks and a safe host binding for the official
# Wazuh compose stack. The Dashboard is intentionally NOT published on host
# port 443: Tailscale Funnel owns 443 for the public FAST UI when sharing is
# enabled. Instead Wazuh is bound only to localhost:5601 and can be exposed to
# the tailnet through `./bin/fast-share` on HTTPS 8443.
#
# `!override` replaces the official `443:5601` port mapping instead of merging
# another mapping into the list. This avoids the 443 collision seen when
# tailscaled already has Funnel active.
#
# Healthchecks reuse the same authority Wazuh itself uses (wazuh-control)
# for the Manager, and lightweight TCP checks for Indexer/Dashboard.

services:
  wazuh.manager:
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/var/ossec/bin/wazuh-control status | grep -q 'wazuh-analysisd is running' && /var/ossec/bin/wazuh-control status | grep -q 'wazuh-remoted is running'"
      interval: 10s
      timeout: 10s
      retries: 9
      start_period: 45s

  wazuh.indexer:
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'"
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 45s

  wazuh.dashboard:
    ports: !override
      - "127.0.0.1:${FAST_WAZUH_DASHBOARD_LOCAL_PORT:-5601}:5601"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5601'"
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 30s
