# FAST IOC Collector web dashboard.
#
# Security default: the host-side port binds only to 127.0.0.1. To expose it
# deliberately on another interface (for example a Tailscale address), set
# FAST_WEB_BIND before `./bin/fast up`, e.g. FAST_WEB_BIND=100.x.y.z.

services:
  ioc-collector-web:
    build:
      context: ..
      dockerfile: docker/ioc-collector.Dockerfile
    image: osint-ioc-collector
    container_name: fast-ioc-collector-web
    restart: unless-stopped
    entrypoint: ["python3", "app.py"]
    ports:
      - "${FAST_WEB_BIND:-127.0.0.1}:5000:5000"
    environment:
      FAST_WEB_HOST: "0.0.0.0"
      FAST_WEB_PORT: "5000"
      FAST_WEB_DEBUG: "0"
      ABUSECH_AUTH_KEY: "${ABUSECH_AUTH_KEY:-}"
    volumes:
      - ../:/app
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:5000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
